name: 缺陷报告
description: 提供可复现的问题与影响
body:
  - type: input
    id: task
    attributes:
      label: 任务编号
      description: "维护者分诊后填写稳定编号，例如 EDIT-01；保留已有编号。"
  - type: dropdown
    id: phase
    attributes:
      label: 阶段
      options:
        - "待分诊"
        - "R0"
        - "R1"
        - "R2"
        - "R3"
        - "R4"
        - "R5"
        - "R6"
        - "R7"
        - "R8"
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: 优先级
      options:
        - "待分诊"
        - "P0"
        - "P1"
        - "P2"
        - "P3"
    validations:
      required: true
  - type: input
    id: dependencies
    attributes:
      label: 前置
      description: "任务 ID 或阶段出口，例如 ROAD-04、R2；无依赖填写 无；未知时填写 待分诊。"
    validations:
      required: true
  - type: dropdown
    id: visual
    attributes:
      label: 视觉验收
      options:
        - "按可复现规则与行为检查"
        - "需要用户确认"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 问题与复现步骤
      description: "最小存档/场景、初始条件、逐步操作和出现频率；附件先脱敏。"
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 预期与实际结果
      description: "分别写明，引用原验收条款；区分用户报告、已复现和代码风险。"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 版本与环境
      description: "提交 SHA、浏览器、画质与分辨率；必要设备类别，不填本机路径。"
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: 影响与证据
      description: "存档、启动/建造影响；截图或录像、脱敏错误；原任务与修复责任。"
    validations:
      required: true
  - type: textarea
    id: recovery
    attributes:
      label: 恢复与回归条件
      description: "临时绕行、数据能否恢复；修复后重复的步骤及相邻场景。"
    validations:
      required: true
