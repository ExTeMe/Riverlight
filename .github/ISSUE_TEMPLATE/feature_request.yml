name: 功能需求
description: 提出可独立验收的产品功能
body:
  - type: dropdown
    id: collaboration
    attributes:
      label: 协作流程
      options: [v2]
    validations:
      required: true
  - type: markdown
    attributes:
      value: "实施前在本任务认领并等待成功回执；认领记录负责人、执行者、分支和独占资源。任务分支经 PR 集成到 dev，产品验收另行确认。"
  - type: input
    id: task
    attributes:
      label: 任务编号
      description: "维护者分诊后填写稳定编号，例如 EDIT-01；保留已有编号。"
  - type: dropdown
    id: phase
    attributes:
      label: 阶段
      options:
        - "待分诊"
        - "R0"
        - "R1"
        - "R2"
        - "R3"
        - "R4"
        - "R5"
        - "R6"
        - "R7"
        - "R8"
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: 优先级
      options:
        - "待分诊"
        - "P0"
        - "P1"
        - "P2"
        - "P3"
    validations:
      required: true
  - type: input
    id: dependencies
    attributes:
      label: 前置
      description: "任务 ID 或阶段出口，例如 ROAD-04、R2；无依赖填写 无；未知时填写 待分诊。"
    validations:
      required: true
  - type: dropdown
    id: visual
    attributes:
      label: 视觉验收
      options:
        - "按可复现规则与行为检查"
        - "需要用户确认"
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: 目标与动机
      description: "谁在什么场景遇到什么问题，完成后能做什么？引用 SYSTEMS 的稳定章节。"
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 范围与非目标
      description: "包含与不包含的行为；现有原型差距；数据、入口和上下游影响。"
    validations:
      required: true
  - type: textarea
    id: scenarios
    attributes:
      label: 验收场景与步骤
      description: "初始存档/种子/镜头和环境，逐步列输入、期望结果及判定方式；覆盖取消、无效输入、拆改、撤销和旧档。"
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收条件
      description: "每项可独立判定；引用 T01～T07。预算未知时记录待测及前置任务，不虚构阈值。"
      placeholder: "- [ ] 给定…，执行…，观察…；通过条件…"
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: 兼容性与证据要求
      description: "旧城保护/迁移、失败恢复、截图或动态证据；视觉任务给出固定近中远镜头和用户确认条件。"
    validations:
      required: true
