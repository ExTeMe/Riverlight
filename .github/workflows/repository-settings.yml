name: Configure integration protection

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Exact branch to protect (main or dev)
        type: choice
        options: [dev, main]
        default: dev
      ruleset_id:
        description: Exact reviewed ruleset ID; use 0 only to create absent dev protection
        required: true
        type: string
      expected_updated_at:
        description: Reviewed updated timestamp; use absent only for a new dev ruleset
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: repository-settings-${{ github.repository }}
  cancel-in-progress: false
  queue: max

jobs:
  configure:
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - run: node scripts/github-settings.mjs
        env:
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          RULESET_ID: ${{ inputs.ruleset_id }}
          RULESET_EXPECTED_UPDATED_AT: ${{ inputs.expected_updated_at }}
          PROTECTED_BRANCH: ${{ inputs.branch || 'main' }}
