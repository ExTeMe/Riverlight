name: Check and publish city

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

# Serialize each branch; a newer push must not be published before an older one.
concurrency:
  group: city-${{ github.event_name == 'pull_request' && github.run_id || github.ref }}
  cancel-in-progress: false
  queue: max

env:
  SITE_BASE: /${{ github.event.repository.name }}/

jobs:
  check:
    concurrency:
      group: city-check-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      publish: ${{ steps.policy.outputs.publish }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - id: policy
        run: node scripts/ci-policy.mjs
      - run: npm ci
        if: steps.policy.outputs.application == 'true'
      - run: npm run check:privacy
      - run: npm run check:docs
      - run: npm run build -- --base="$SITE_BASE"
        if: steps.policy.outputs.application == 'true'
      - run: node scripts/check-dist.mjs "$SITE_BASE"
        if: steps.policy.outputs.application == 'true'
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: steps.policy.outputs.publish == 'true'
        with:
          path: dist
          retention-days: 7

  snapshot:
    needs: check
    if: >-
      needs.check.outputs.publish == 'true' && github.ref == 'refs/heads/dev' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: github-pages
          path: ${{ runner.temp }}/city-artifact
      - name: Restore validated output and update gh-pages
        run: |
          mkdir dist
          tar -xf "$RUNNER_TEMP/city-artifact/artifact.tar" -C dist
          node scripts/publish-static.mjs

  deploy:
    needs: [check, snapshot]
    if: >-
      needs.check.outputs.publish == 'true' && github.ref == 'refs/heads/dev' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
