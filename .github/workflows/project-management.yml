name: Manage project

on:
  issues:
    types: [opened, edited, labeled, unlabeled, closed, reopened]
  push:
    branches: [dev]
    paths: ['.github/workflows/project-management.yml', 'scripts/github-management.mjs']
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      bootstrap:
        description: Prepare milestones, labels, task relationships, and the project
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: project-management-${{ github.repository }}
  cancel-in-progress: false
  queue: max

jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Issue text is data. Never check out or execute a contributor's PR code.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - run: node --test tests/github-management.test.js
      - name: Synchronize repository and Project metadata
        run: node scripts/github-management.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
          MANAGEMENT_BOOTSTRAP: ${{ github.event_name == 'push' || inputs.bootstrap == true }}
